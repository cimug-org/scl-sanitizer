name: Static Analysis

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: read

jobs:
  static-analysis:
    name: Ruff and Bandit
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install analysis tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff bandit

      - name: Run Ruff
        run: |
          ruff check . --output-format=github
          ruff format --check .

      - name: Run Bandit
        run: |
          bandit \
            --recursive . \
            --exclude ./.venv,./build,./dist,./tests \
            --severity-level medium \
            --confidence-level medium

      - name: Generate analysis reports
        if: always()
        run: |
          ruff check . --output-format=json > ruff-report.json || true

          bandit \
            --recursive . \
            --exclude ./.venv,./build,./dist,./tests \
            --format json \
            --output bandit-report.json || true

      - name: Upload analysis reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: static-analysis-reports
          path: |
            ruff-report.json
            bandit-report.json
          if-no-files-found: error